<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #f1f5f9;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .gradient-text {
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="card w-full max-w-4xl">
            <div class="flex justify-between items-center border-b pb-4 mb-6">
                <div>
                    <h1 class="text-3xl font-bold gradient-text">👋 مرحباً أيها الأدمن</h1>
                    <p class="text-gray-500 text-sm">أنت الآن داخل لوحة التحكم الخاصة بك</p>
                </div>
                <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-xl font-semibold shadow-lg transition flex items-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> تسجيل خروج
                </button>
            </div>

            <!-- محتوى لوحة التحكم -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
                <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
                    <i class="fas fa-users text-3xl text-indigo-600 mb-3"></i>
                    <h3 class="font-bold text-xl">إدارة المستخدمين</h3>
                    <p class="text-gray-600 text-sm">التحكم في حسابات الطلاب</p>
                </div>
                <div class="bg-sky-50 p-6 rounded-2xl border border-sky-100">
                    <i class="fas fa-chart-bar text-3xl text-sky-600 mb-3"></i>
                    <h3 class="font-bold text-xl">الإحصائيات</h3>
                    <p class="text-gray-600 text-sm">عرض التقارير والبيانات</p>
                </div>
                <div class="bg-emerald-50 p-6 rounded-2xl border border-emerald-100">
                    <i class="fas fa-cog text-3xl text-emerald-600 mb-3"></i>
                    <h3 class="font-bold text-xl">الإعدادات</h3>
                    <p class="text-gray-600 text-sm">تعديل إعدادات النظام</p>
                </div>
            </div>

            <div class="mt-8 p-4 bg-gray-50 rounded-2xl text-center text-gray-500 text-sm border border-dashed">
                <i class="fas fa-shield-alt text-indigo-500 ml-2"></i>
                هذه الصفحة محمية، ولا يمكن لأي شخص غير الأدمن رؤيتها.
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bzkbamohnjjzwxlvnodm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_u48RJaZLVcDk-rXmzsl0NQ_N9egVFEb';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const ADMINS_TABLE = 'admins';

        async function checkAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            // التحقق من صلاحية الأدمن
            const { data, error } = await _supabase
                .from(ADMINS_TABLE)
                .select('id')
                .eq('id', session.user.id)
                .maybeSingle();

            if (error || !data) {
                await _supabase.auth.signOut();
                alert('ليس لديك صلاحية الدخول لهذه الصفحة');
                window.location.href = 'index.html';
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        // تشغيل التحقق فور تحميل الصفحة
        checkAuth();
    </script>
</body>
</html>
